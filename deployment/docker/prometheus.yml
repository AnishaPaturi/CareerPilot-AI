global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9999'] # Resolves to host machine port 9999 (Spring Boot)

  - job_name: 'fastapi-ai-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000'] # Resolves to host machine port 8000 (FastAPI)
